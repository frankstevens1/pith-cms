name: Release packages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create release PR or publish versioned packages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for package changes
        id: filter
        if: github.event_name == 'workflow_run'
        run: |
          if git diff --name-only "${{ github.event.workflow_run.head_sha }}~1" "${{ github.event.workflow_run.head_sha }}" 2>/dev/null | grep -v '\.md$' | grep -q '^packages/'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'
        with:
          node-version: 24.7.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'

      - run: pnpm build
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'

      - id: changesets
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true'
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm version:packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
